<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>복싱 트레이너가 이사했어요</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#F4F7FF">
<style>
:root{--bg:#F4F7FF;--card:#FFFFFF;--ink:#1E2340;--sub:#4A5070;--btn:#3F5EF0;--btn-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#12152A;--card:#1C2040;--ink:#EEF1FF;--sub:#B8BEDD}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;text-align:center}
main{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:36px 20px 28px;box-shadow:0 8px 30px rgba(30,35,64,.12)}
.ico{font-size:72px;line-height:1}
h1{font-size:27px;margin:16px 0 8px;word-break:keep-all}
p{margin:0;font-size:20px;line-height:1.5;color:var(--sub);word-break:keep-all}
.go{display:flex;align-items:center;justify-content:center;min-height:96px;margin:26px 0 16px;padding:0 16px;border-radius:24px;background:var(--btn);color:var(--btn-ink);font-size:26px;font-weight:800;text-decoration:none}
.go:focus-visible{outline:4px solid #FFB020;outline-offset:3px}
.auto{font-size:18px}
</style>
</head>
<body>
<main>
<div class="ico" aria-hidden="true">🥊🚚</div>
<h1>복싱 트레이너가 이사했어요</h1>
<p>이제 배움퀘스트에서 만나요</p>
<a class="go" id="go" href="https://bsy522-dot.github.io/levelplay/games/boxing-trainer-v5.html">배움퀘스트로 가기</a>
<p class="auto" aria-live="polite"><b id="sec">3</b>초 뒤에 저절로 가요</p>
</main>
<script>
(function(){
var TO='https://bsy522-dot.github.io/levelplay/games/boxing-trainer-v5.html';
var ROOT=location.origin+'/boxing-trainer/';
var OWN=/^boxing-trainer-v\d+(?:-[0-9a-z]+)*$/;
var a=document.getElementById('go'),s=document.getElementById('sec');
var jobs=[];
try{if('serviceWorker' in navigator){jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(ROOT)===0}).map(function(r){return r.unregister()}))}))}}catch(e){}
try{if(window.caches){jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return OWN.test(k)}).map(function(k){return caches.delete(k)}))}))}}catch(e){}
var clean=Promise.all(jobs).catch(function(){});
var gone=false;
function go(){if(gone)return;gone=true;location.replace(TO)}
a.addEventListener('click',function(e){e.preventDefault();go()});
var n=3,t=setInterval(function(){n--;if(n>0){s.textContent=n;return}clearInterval(t);clean.then(go);setTimeout(go,1500)},1000);
})();
</script>
</body>
</html>
